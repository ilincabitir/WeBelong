
spring.application.name=webelong-backend

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/webelong
spring.datasource.username=postgres
spring.datasource.password=ilinca123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8080

# JWT configuration
app.jwt.secret=${JWT_SECRET:c3VwZXJ2ZXJ5c2VjcmV0a2V5aXdpbGxyZXBsYWNlaXR3aXRoc29tZXRoaW5nYmV0dGVy}
app.jwt.expiration-ms=86400000

# Avoid lazy-loading surprises in the view layer
spring.jpa.open-in-view=false

# Uploads
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB